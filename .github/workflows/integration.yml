name: Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Получение проекта
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка инструментов
        run: python -m pip install -r requirements-dev.txt

      - name: Проверка компиляции
        run: python -m compileall -q src

      - name: Проверка оформления
        run: python -m flake8 src tests --max-line-length=100

      - name: Тесты и покрытие
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage combine
          python -m coverage report -m --fail-under=90
          python -m coverage xml

      - name: Сохранение отчёта покрытия
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
