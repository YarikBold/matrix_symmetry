name: Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Получение проекта
        uses: actions/checkout@v7
      - name: Установка Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Установка инструментов
        run: python -m pip install -r requirements-dev.txt
      - name: Проверка компиляции
        run: python -m compileall -q src
      - name: Проверка оформления
        run: python -m flake8 src tests --max-line-length=100 --statistics --count
      - name: Регрессионные тесты
        run: python -m pytest -q -m regression
      - name: Полный набор и покрытие
        run: |
          python -m coverage run --branch -m pytest -q --junitxml=build/junit.xml
          python -m coverage combine
          python -m coverage xml -o build/coverage.xml
          python -m coverage report -m --precision=2 --fail-under=90
      - name: Сохранение XML-отчётов
        uses: actions/upload-artifact@v7
        with:
          name: matrix-symmetry-test-reports
          path: |
            build/junit.xml
            build/coverage.xml
          if-no-files-found: error
